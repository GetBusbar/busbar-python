# Imported from .github/workflows/ci.yml by `modernci import github`.
to: dev
checks:
  build:
    run: |
      set -e
      # PINNED PYTHON: openapi-python-client 0.29 and this package need python >= 3.11, and the
      # fleet's python3 is older. python-build-standalone cpython 3.12 by sha256, in a venv.
      PY_TAG=20261026; PY_VER=3.12.16
      case "$(uname -m)" in
        x86_64) arch=x86_64; sha=6a79e922e50006b601f29e688407659da1c2b86ebcd4e9c7254cf234be8b89de ;;
        aarch64|arm64) arch=aarch64; sha=a945427411dc6851a1393533b74a4a1ac434321ae397f2ec69897a9b4fde032b ;;
        *) echo "::error::no pinned python for $(uname -m)"; exit 1 ;;
      esac
      cache="${MODERNCI_CACHE_DIR:-$HOME/.cache}/pinned-python"; mkdir -p "$cache"
      tgz="$cache/cpython-$PY_VER-$PY_TAG-$arch.tar.gz"
      if [ ! -f "$tgz" ] || [ "$(sha256sum "$tgz" | cut -d' ' -f1)" != "$sha" ]; then
        curl -fsSL --retry 3 -o "$tgz.part" "https://github.com/astral-sh/python-build-standalone/releases/download/$PY_TAG/cpython-$PY_VER%2B$PY_TAG-$arch-unknown-linux-gnu-install_only.tar.gz"
        [ "$(sha256sum "$tgz.part" | cut -d' ' -f1)" = "$sha" ] || { echo "::error::python tarball sha256 mismatch"; exit 1; }
        mv "$tgz.part" "$tgz"
      fi
      py="$(mktemp -d)"; tar -xzf "$tgz" -C "$py"
      "$py/python/bin/python3" -m venv "$py/venv"
      export PATH="$py/venv/bin:$PATH"
      python --version
      # Install generator (pinned)
      pip install -r requirements-dev.txt </dev/null
      # Regenerate client from openapi.json
      make generate </dev/null
      # Fail if the committed client is stale
      ( bash -e /dev/fd/3 3<<'MODERNCI_STEP' </dev/null
      git diff --exit-code -- busbar_admin setup.py \
        || (echo "::error::Generated client is out of date. Run 'make generate' and commit." && exit 1)
      MODERNCI_STEP
      )
      # Editable install + typed import smoke test
      ( bash -e /dev/fd/3 3<<'MODERNCI_STEP' </dev/null
      pip install -e .
      python -c "from busbar_admin.api.default import get_api_v1_admin_info; from busbar_admin.models import InfoView; import attrs; print('typed InfoView fields:', [f.name for f in attrs.fields(InfoView)])"
      MODERNCI_STEP
      )
    requires:
    - python3
    - pip
  coverage:
    run: |
      set -e
      # PINNED PYTHON: openapi-python-client 0.29 and this package need python >= 3.11, and the
      # fleet's python3 is older. python-build-standalone cpython 3.12 by sha256, in a venv.
      PY_TAG=20261026; PY_VER=3.12.16
      case "$(uname -m)" in
        x86_64) arch=x86_64; sha=6a79e922e50006b601f29e688407659da1c2b86ebcd4e9c7254cf234be8b89de ;;
        aarch64|arm64) arch=aarch64; sha=a945427411dc6851a1393533b74a4a1ac434321ae397f2ec69897a9b4fde032b ;;
        *) echo "::error::no pinned python for $(uname -m)"; exit 1 ;;
      esac
      cache="${MODERNCI_CACHE_DIR:-$HOME/.cache}/pinned-python"; mkdir -p "$cache"
      tgz="$cache/cpython-$PY_VER-$PY_TAG-$arch.tar.gz"
      if [ ! -f "$tgz" ] || [ "$(sha256sum "$tgz" | cut -d' ' -f1)" != "$sha" ]; then
        curl -fsSL --retry 3 -o "$tgz.part" "https://github.com/astral-sh/python-build-standalone/releases/download/$PY_TAG/cpython-$PY_VER%2B$PY_TAG-$arch-unknown-linux-gnu-install_only.tar.gz"
        [ "$(sha256sum "$tgz.part" | cut -d' ' -f1)" = "$sha" ] || { echo "::error::python tarball sha256 mismatch"; exit 1; }
        mv "$tgz.part" "$tgz"
      fi
      py="$(mktemp -d)"; tar -xzf "$tgz" -C "$py"
      "$py/python/bin/python3" -m venv "$py/venv"
      export PATH="$py/venv/bin:$PATH"
      python --version
      # Install project + coverage tooling
      ( bash -e /dev/fd/3 3<<'MODERNCI_STEP' </dev/null
      pip install -e .
      pip install pytest pytest-cov
      MODERNCI_STEP
      )
      # Run pytest with coverage
      ( bash -e /dev/fd/3 3<<'MODERNCI_STEP' </dev/null
      # Non-required coverage job. Exit code 5 == "no tests collected"
      # (the repo currently ships only a generated client); treat that as
      # success so real test failures still fail while an empty suite does not.
      pytest --cov=busbar_admin --cov-report=xml || [ $? -eq 5 ]
      MODERNCI_STEP
      )
    requires:
    - python3
    - pip
env:
  CI: 'true'
